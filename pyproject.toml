[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "xiaogpt-voice"
version = "2.0.0"
description = "DeepSeek voice assistant for Xiaomi AI speakers"
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = {text = "MIT"}
authors = [{name = "Wuchangyue-zh"}]
dependencies = ["aiohttp==3.14.4", "httpx[socks]==0.28.1", "miservice==3.0.1", "openai==3.26.0"]

[project.urls]
Homepage = "https://github.com/Wuchangyue-zh/xiaogpt"
Issues = "https://github.com/Wuchangyue-zh/xiaogpt/issues"

[project.scripts]
xiaogpt-voice = "xiaogpt_voice.cli:main"

[tool.setuptools.packages.find]
include = ["xiaogpt_voice*"]

[tool.setuptools]
license-files = ["LICENSE", "LICENSES/*.txt"]

[tool.setuptools.package-data]
xiaogpt_voice = ["defaults/*.json", "defaults/*.txt"]
