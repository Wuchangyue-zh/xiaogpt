name: Standalone build and offline tests

on:
  push:
    branches: [main, complete-project]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  clean-image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Validate shell and Compose
        run: |
          bash -n setup.sh install.sh
          docker compose config --quiet
      - name: Build complete project from source
        run: docker build --progress=plain -t xiaogpt-complete:ci .
      - name: Check standalone help without credentials
        run: |
          docker run --rm xiaogpt-complete:ci --help
          docker run --rm --entrypoint pdm xiaogpt-complete:ci run python configure.py --help
      - name: Test imported upstream code
        run: docker run --rm --entrypoint pdm xiaogpt-complete:ci run python -m unittest discover -s tests -v
      - name: Test enhancement and first-run wizard
        run: docker run --rm --entrypoint pdm xiaogpt-complete:ci run python -m unittest -v test_smart_voice test_standalone
