name: xiaogpt-voice
services:
  speaker:
    build: .
    image: xiaogpt-voice:local
    restart: unless-stopped
    init: true
    environment:
      XIAOGPT_DATA_DIR: /config
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./data:/config
    command: ["run"]
    cpus: 1.0
    mem_limit: 1g
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
